# black/white theme matching waybar, mako and the volume popup
[main]
# same font as before (fuzzel's default), just smaller
font=monospace:size=10
dpi-aware=no
icon-theme=hicolor
icons-enabled=yes
fields=filename,name,generic
password-character=*
match-mode=fuzzy
show-actions=yes
# a bit more room between entries than the font's own line height
line-height=20
# show 10 entries instead of the default 15
lines=10
vertical-pad=10

[colors]
background=000000ff
text=aaaaaaff
prompt=ffffffff
input=ffffffff
placeholder=555555ff
match=ffffffff
selection=3a3a3aff
selection-text=ffffffff
selection-match=ffffffff
border=3a3a3aff

[border]
width=1
radius=10
