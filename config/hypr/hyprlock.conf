# black/white theme matching waybar, mako and fuzzel. Only the wallpaper shows until you type;
# there is no clock, since hyprlock can't hide labels while the password is empty.
# $wallpaper comes from ~/.cache/hyprlock-wallpaper.conf, written by lock.sh before each lock.
source = ~/.cache/hyprlock-wallpaper.conf

$font = Ubuntu Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# wallpaper shown as-is (no blur/dim)
background {
    monitor =
    path = $wallpaper
    color = rgb(000000)
}

# password box: same black box, grey outline and corners as the bar's boxes.
# fades out after 1s while empty (also right after locking) and back in when you type
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    rounding = 10
    inner_color = rgba(000000aa)
    outer_color = rgb(3a3a3a)
    check_color = rgb(ffffff)
    fail_color = rgb(ff0000)
    font_color = rgb(ffffff)
    font_family = $font
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Password
    fail_text = $FAIL
    dots_size = 0.25
    dots_spacing = 0.3

    position = 0, 0
    halign = center
    valign = center
}
